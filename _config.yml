# His Word Christian Centre website — Jekyll settings for GitHub Pages.
# Content lives in the _data/ folder. You rarely need to change this file.

title: His Word Christian Centre
timezone: Africa/Johannesburg

# While true, the site asks search engines NOT to list it.
# Launched 12 Oct 2026 — keep false.
preview: false

url: https://hiswordchristiancentre.co.za

exclude:
  - README.md
  - CLAUDE.md
  - UPDATING.md
  - tools
  - Gemfile
  - Gemfile.lock
  - HWCC-homepage-preview.html

# Publish the .well-known folder (Jekyll skips dot-folders by default)
include:
  - .well-known
